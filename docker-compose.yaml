services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=${DB_USER:?set DB_USER - run compose with --env-file .env}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD - run compose with --env-file .env}
      - POSTGRES_DB=${DB_NAME:?set DB_NAME - run compose with --env-file .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
  migrate:
    build: .
    command: ["python", "-m", "alembic", "upgrade", "head"]
    env_file: [./backend/.env]
    environment: [DB_HOST=db]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
 
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
    depends_on:
       db:
         condition: service_healthy
       migrate:
         condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 3
 
volumes:
  postgres_data:
