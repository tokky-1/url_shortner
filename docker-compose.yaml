services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=${DB_USER:?set DB_USER - run compose with --env-file .env}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD - run compose with --env-file .env}
      - POSTGRES_DB=${DB_NAME:?set DB_NAME - run compose with --env-file .env}
    ports: #5432:5432 publishes Postgres to your host. Fine for local work. In AWS it would be a security group rule, never a public port.
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7
    ports: #6379:6379 is for local inspection with redis-cli. In AWS this would be ElastiCache, not a published port.
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    image: urlshortener:local
    command: ["python", "-m", "alembic", "upgrade", "head"]
    env_file: [.env]
    environment: [DB_HOST=db]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
 
  app:
    image: urlshortener:local
    # One worker, to keep the Redis before/after comparable with the baseline,
    # which was measured on one worker. Four workers roughly doubles spread
    # throughput but changes two variables at once. Each worker gets its own
    # SQLAlchemy pool (5 + 10 overflow), so N workers can open up to N*15
    # connections against Postgres's max_connections of 100 (97 usable).
    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
       db:
         condition: service_healthy
       redis:
         condition: service_healthy
       migrate:
         condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
 
volumes:
  postgres_data:
